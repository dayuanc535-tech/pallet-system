<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>棧板管理系統</title>
<style>
  :root{--g:#2f8f4e;--g2:#256e3d;--bg:#f3f5f4;--line:#e3e7e5;--ink:#1d2521;--mut:#6b766f;--red:#c0392b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
  header h1{font-size:19px;margin:0;font-weight:800}
  .who{margin-left:auto;text-align:right;font-size:12px;color:var(--mut);line-height:1.4}
  .who b{color:var(--ink)}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:11px 0;border:1px solid var(--line);background:#fff;border-radius:11px;
    font-size:15px;font-weight:700;color:var(--mut)}
  .tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  label.fld{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 6px}
  label.fld:first-child{margin-top:0}
  select,input[type=number],input[type=text],textarea{width:100%;padding:12px;border:1px solid var(--line);
    border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:12px 0;border:1px solid var(--line);background:#fff;border-radius:10px;
    font-size:15px;font-weight:700;color:var(--mut)}
  .seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
  .seg.act button.on{background:var(--g2);border-color:var(--g2)}
  .qtyrow{display:flex;align-items:center;gap:10px}
  .qtyrow button{width:48px;height:48px;border:1px solid var(--line);background:#fff;border-radius:10px;
    font-size:24px;font-weight:700;color:var(--g)}
  .qtyrow input{text-align:center;font-size:22px;font-weight:800}
  canvas.sign{width:100%;height:170px;border:1px dashed #b9c2bc;border-radius:10px;background:#fbfcfb;touch-action:none}
  .sub{font-size:12px;color:var(--mut);margin:6px 2px 0}
  .row2{display:flex;gap:8px}
  .row2>*{flex:1}
  .btnP{display:block;width:100%;padding:15px;border:none;border-radius:12px;background:var(--g);color:#fff;
    font-size:17px;font-weight:800;margin-top:18px}
  .btnP:disabled{opacity:.5}
  .btnG{background:#fff;border:1px solid var(--line);color:var(--mut);padding:9px 12px;border-radius:9px;font-size:13px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--mut);font-size:12px}
  .big{font-size:13px;color:var(--mut)}
  .tot{display:flex;gap:10px;margin-bottom:12px}
  .tot .b{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .tot .b .n{font-size:24px;font-weight:800}
  .tot .b .l{font-size:12px;color:var(--mut)}
  .pos{color:var(--red);font-weight:700}
  .msg{padding:12px;border-radius:10px;font-size:14px;margin-top:12px;display:none}
  .msg.ok{background:#e8f6ec;color:var(--g2);display:block}
  .msg.err{background:#fdecea;color:var(--red);display:block}
  #gate{text-align:center;padding:40px 16px;color:var(--mut)}
  #uidbox{user-select:all;background:#fff;border:1px dashed #b9c2bc;border-radius:10px;padding:12px;
    font-size:13px;word-break:break-all;margin:12px 0}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🪵 棧板管理</h1>
    <div class="who" id="who"></div>
  </header>

  <div id="gate">載入中…</div>

  <div id="app" class="hide">
    <div class="tabs" id="tabs">
      <button data-tab="rec" class="on">📥 記錄</button>
      <button data-tab="qry">📊 查詢</button>
      <button data-tab="set" class="hide">📄 月結算</button>
    </div>

    <!-- 記錄 -->
    <section id="rec" class="card">
      <label class="fld">場</label>
      <select id="site"></select>

      <div id="custWrap">
        <label class="fld">客戶</label>
        <select id="cust"></select>
      </div>

      <label class="fld">棧板別</label>
      <div class="seg" id="ptype">
        <button data-v="大" class="on">大棧板 $<span id="p大">500</span></button>
        <button data-v="小">小棧板 $<span id="p小">168</span></button>
      </div>

      <label class="fld">動作</label>
      <div class="seg act" id="pact"></div>

      <label class="fld">數量</label>
      <div class="qtyrow">
        <button type="button" id="minus">−</button>
        <input type="number" id="qty" value="1" min="1" inputmode="numeric">
        <button type="button" id="plus">＋</button>
      </div>

      <label class="fld">簽收 — 現場簽名</label>
      <canvas class="sign" id="sign"></canvas>
      <div class="row2" style="margin-top:6px">
        <button type="button" class="btnG" id="clearSign">清除簽名</button>
        <label class="btnG" style="text-align:center">
          📷 拍/選單據<input type="file" id="photo" accept="image/*" capture="environment" class="hide">
        </label>
      </div>
      <div class="sub" id="photoName"></div>

      <label class="fld">備註（可空）</label>
      <input type="text" id="note" placeholder="例：補單、半板…">

      <button class="btnP" id="submit">送出記錄</button>
      <div class="msg" id="recMsg"></div>
    </section>

    <!-- 查詢 -->
    <section id="qry" class="card hide">
      <div class="big" style="margin-bottom:10px">全部門目前持有（新購−報廢）</div>
      <div class="tot" id="deptTot"></div>
      <div class="big" style="margin-bottom:6px">各客戶手上未歸還</div>
      <table>
        <thead><tr><th>客戶</th><th>大棧板</th><th>小棧板</th></tr></thead>
        <tbody id="balBody"></tbody>
      </table>
      <button type="button" class="btnG" id="refresh" style="margin-top:14px;width:100%">🔄 重新整理</button>
    </section>

    <!-- 月結算 -->
    <section id="set" class="card hide">
      <label class="fld">結算月份</label>
      <div class="row2">
        <input type="month" id="setMonth">
        <button type="button" class="btnG" id="setQuery">查詢明細</button>
      </div>

      <div id="setSummary" class="tot" style="margin-top:14px"></div>

      <div style="overflow-x:auto">
        <table id="setTable" class="hide">
          <thead><tr>
            <th>客戶</th><th>送出<br>大/小</th><th>歸還<br>大/小</th>
            <th>本月金額</th><th>類別</th><th>期末<br>未還</th>
          </tr></thead>
          <tbody id="setBody"></tbody>
        </table>
      </div>

      <button class="btnP" id="genExcel" style="margin-top:16px">📄 產生 Excel 存到雲端硬碟</button>
      <div class="msg" id="setMsg"></div>

      <div class="big" style="margin:20px 0 6px">📂 歷史報表（存在你的 Google Drive）</div>
      <div id="reportList" class="big">—</div>
    </section>
  </div>

  <!-- 經銷客戶自助（獨立畫面，不顯示分頁列） -->
  <div id="mineView" class="hide">
    <div class="card" style="text-align:center">
      <div class="big" id="mineName">—</div>
      <div class="tot" style="margin-top:12px">
        <div class="b"><div class="n pos" id="mineBig">0</div><div class="l">大棧板未還</div></div>
        <div class="b"><div class="n pos" id="mineSmall">0</div><div class="l">小棧板未還</div></div>
      </div>
      <div class="big" id="mineAmt" style="margin-top:4px"></div>
    </div>
    <div class="card">
      <div class="big" style="margin-bottom:8px">📋 進出明細（新到舊）</div>
      <div id="mineHist" class="big">載入中…</div>
      <button type="button" class="btnG" id="mineRefresh" style="margin-top:12px;width:100%">🔄 重新整理</button>
    </div>
  </div>
</div>

<script>
/* ====== 設定 ====== */
var GAS_URL  = "https://script.google.com/macros/s/AKfycbyOOX6lyw9VkAl9jqekWNN4hymoHvy4L1WUTTY6qtEkczP3nCETdCubNijmRZst66PHdQ/exec";
/* ================== */

var ME = null;

function $(s){return document.querySelector(s);}
function api(params){
  var u = GAS_URL + "?" + Object.keys(params).map(function(k){
    return k+"="+encodeURIComponent(params[k]);}).join("&");
  return fetch(u).then(function(r){return r.json();});
}
function post(body){
  return fetch(GAS_URL,{method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(body)}).then(function(r){return r.json();});
}

/* ---- 啟動：用網址 ?k=代碼 辨識身分 ---- */
function getCode(){
  var m = location.search.match(/[?&]k=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
(async function(){
  try{
    var code = getCode();
    if(!code){ showGate(); return; }
    ME = await api({action:"me", uid:code});
    ME.uid = code;
    if(!ME.known){ showGate(); return; }
    boot();
  }catch(err){
    $("#gate").innerHTML = "啟動失敗：" + err;
  }
})();

function showGate(){
  var base = location.origin + location.pathname;
  $("#gate").innerHTML =
    '<p>無法辨識身分。</p>'+
    '<p>請用管理員給你的<b>專屬連結</b>開啟（網址結尾要有 <code>?k=你的代碼</code>）。</p>'+
    '<p style="font-size:13px;color:var(--mut)">管理員：到 Google Sheets「角色」分頁新增一列代碼，再把連結<br>'+
    '<code>'+base+'?k=代碼</code><br>傳給對方即可。</p>';
}

function boot(){
  $("#gate").classList.add("hide");

  // 經銷客戶：獨立自助畫面，只看自己這家
  if(ME.role==="經銷"){
    $("#who").innerHTML='<b>'+ME.name+'</b><br>經銷客戶';
    $("#mineView").classList.remove("hide");
    $("#mineRefresh").onclick=loadMine;
    loadMine();
    return;
  }

  $("#app").classList.remove("hide");
  $("#who").innerHTML = '<b>'+ME.name+'</b><br>'+ME.role+(ME.site?'・'+ME.site:'');
  $("#p大").textContent = ME.prices["大"];
  $("#p小").textContent = ME.prices["小"];

  // 場
  var siteSel = $("#site");
  if(ME.role==="現場" && ME.site){
    siteSel.innerHTML = '<option>'+ME.site+'</option>'; siteSel.disabled = true;
  }else{
    siteSel.innerHTML = ME.sites.map(function(s){return '<option>'+s+'</option>';}).join("");
  }
  // 客戶
  $("#cust").innerHTML = ME.customers.map(function(c){
    return '<option value="'+c.編號+'">'+c.名稱+'</option>';}).join("");
  // 動作（管理員多 報廢/新購）
  var acts = ["送出","歸還"];
  if(ME.role==="管理員") acts = acts.concat(["報廢","新購"]);
  $("#pact").innerHTML = acts.map(function(a,i){
    return '<button data-v="'+a+'"'+(i===0?' class="on"':'')+'>'+a+'</button>';}).join("");

  // 做帳/管理員 可看月結算
  if(ME.role==="做帳" || ME.role==="管理員"){
    $("[data-tab=set]").classList.remove("hide");
    var d=new Date(); $("#setMonth").value=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);
  }
  // 做帳只看查詢/結算，沒有記錄
  if(ME.role==="做帳"){
    $("#rec").classList.add("hide");
    $("[data-tab=rec]").classList.add("hide");
    switchTab("qry");
  }
  bindUI();
  initSign();
}

/* ---- 分頁 ---- */
function switchTab(t){
  document.querySelectorAll("#tabs button").forEach(function(b){
    b.classList.toggle("on", b.dataset.tab===t);});
  $("#rec").classList.toggle("hide", t!=="rec");
  $("#qry").classList.toggle("hide", t!=="qry");
  $("#set").classList.toggle("hide", t!=="set");
  if(t==="qry") loadBalances();
  if(t==="set"){ loadSettlement(); loadReports(); }
}

/* ---- UI 綁定 ---- */
var sel = {ptype:"大", pact:"送出"};
function bindUI(){
  document.querySelectorAll("#tabs button").forEach(function(b){
    b.onclick=function(){switchTab(b.dataset.tab);};});
  segBind("#ptype","ptype",toggleCust);
  segBind("#pact","pact",toggleCust);
  $("#minus").onclick=function(){stepQty(-1);};
  $("#plus").onclick=function(){stepQty(1);};
  $("#photo").onchange=onPhoto;
  $("#clearSign").onclick=clearSign;
  $("#submit").onclick=submit;
  $("#refresh").onclick=loadBalances;
  $("#setQuery").onclick=loadSettlement;
  $("#genExcel").onclick=genReport;
  toggleCust();
}
function segBind(box,key,after){
  document.querySelectorAll(box+" button").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll(box+" button").forEach(function(x){x.classList.remove("on");});
      b.classList.add("on"); sel[key]=b.dataset.v; if(after) after();
    };});
}
function toggleCust(){
  var deptAct = (sel.pact==="報廢"||sel.pact==="新購");
  $("#custWrap").classList.toggle("hide", deptAct);
}
function stepQty(d){
  var q=$("#qty"); q.value=Math.max(1,(parseInt(q.value,10)||1)+d);
}

/* ---- 簽名板 ---- */
var ctx, drawing=false, signed=false;
function initSign(){
  var cv=$("#sign"), r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.lineWidth=2.4;
  ctx.lineCap="round"; ctx.strokeStyle="#1d2521";
  function pos(e){var b=cv.getBoundingClientRect();var t=e.touches?e.touches[0]:e;
    return {x:t.clientX-b.left,y:t.clientY-b.top};}
  function start(e){drawing=true;signed=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();}
  function move(e){if(!drawing)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();}
  function end(){drawing=false;}
  cv.addEventListener("touchstart",start,{passive:false});
  cv.addEventListener("touchmove",move,{passive:false});
  cv.addEventListener("touchend",end);
  cv.addEventListener("mousedown",start);
  cv.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
}
function clearSign(){var cv=$("#sign");ctx.clearRect(0,0,cv.width,cv.height);signed=false;}
function signData(){return signed?$("#sign").toDataURL("image/png"):"";}

/* ---- 拍照（壓縮） ---- */
var photoData="";
function onPhoto(e){
  var f=e.target.files[0]; if(!f) return;
  $("#photoName").textContent="處理中…";
  var img=new Image(), rd=new FileReader();
  rd.onload=function(){img.src=rd.result;};
  img.onload=function(){
    var max=1280, s=Math.min(1,max/Math.max(img.width,img.height));
    var c=document.createElement("canvas");
    c.width=img.width*s; c.height=img.height*s;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    photoData=c.toDataURL("image/jpeg",0.8);
    $("#photoName").textContent="✓ 已附單據照片";
  };
  rd.readAsDataURL(f);
}

/* ---- 送出 ---- */
async function submit(){
  var btn=$("#submit"), msg=$("#recMsg");
  msg.className="msg";
  var deptAct=(sel.pact==="報廢"||sel.pact==="新購");
  var payload={
    action:"record", uid:ME.uid,
    場:$("#site").value, 客戶編號:deptAct?"":$("#cust").value,
    棧板別:sel.ptype, 動作:sel.pact,
    數量:parseInt($("#qty").value,10)||0,
    簽名:signData(), 照片:photoData, 備註:$("#note").value.trim()
  };
  if(payload.數量<=0){msg.className="msg err";msg.textContent="數量需大於 0";return;}
  btn.disabled=true; btn.textContent="送出中…";
  try{
    var r=await post(payload);
    if(r.ok){
      msg.className="msg ok";
      msg.textContent="✅ 已記錄（單號 "+r.單號+"）";
      $("#qty").value=1; clearSign(); photoData=""; $("#photoName").textContent="";
      $("#note").value="";
    }else{ msg.className="msg err"; msg.textContent="⚠ "+r.error; }
  }catch(err){ msg.className="msg err"; msg.textContent="送出失敗："+err; }
  btn.disabled=false; btn.textContent="送出記錄";
}

/* ---- 查詢 ---- */
async function loadBalances(){
  $("#balBody").innerHTML='<tr><td colspan="3" style="color:#6b766f">載入中…</td></tr>';
  var r=await api({action:"balances"});
  if(!r.ok){$("#balBody").innerHTML='<tr><td colspan="3">'+r.error+'</td></tr>';return;}
  $("#deptTot").innerHTML=
    box("大棧板在庫",r.inStock["大"],"持有"+r.dept["大"])+
    box("小棧板在庫",r.inStock["小"],"持有"+r.dept["小"]);
  if(!r.customers.length){
    $("#balBody").innerHTML='<tr><td colspan="3" style="color:#6b766f">目前沒有未歸還</td></tr>';return;}
  $("#balBody").innerHTML=r.customers.map(function(c){
    return '<tr><td>'+c.名稱+'</td>'+
      '<td class="'+(c.大>0?'pos':'')+'">'+c.大+'</td>'+
      '<td class="'+(c.小>0?'pos':'')+'">'+c.小+'</td></tr>';}).join("");
}
function box(l,n,sub){
  return '<div class="b"><div class="n">'+n+'</div><div class="l">'+l+'<br>'+sub+'</div></div>';
}

/* ---- 月結算 ---- */
function curMonth(){ return $("#setMonth").value || ""; }
async function loadSettlement(){
  var m=curMonth(); if(!m) return;
  $("#setBody").innerHTML='<tr><td colspan="6" style="color:#6b766f">載入中…</td></tr>';
  $("#setTable").classList.remove("hide");
  var r=await api({action:"settlement", month:m});
  if(!r.ok){$("#setBody").innerHTML='<tr><td colspan="6">'+r.error+'</td></tr>';return;}
  var t=r.totals;
  $("#setSummary").innerHTML=
    box("本月應開發票","$"+t.應開,"送出未還")+
    box("本月折讓","$"+t.折讓,"已歸還");
  if(!r.rows.length){
    $("#setBody").innerHTML='<tr><td colspan="6" style="color:#6b766f">本月無紀錄</td></tr>';return;}
  $("#setBody").innerHTML=r.rows.map(function(c){
    var cls=c.類別==="應開發票"?"pos":"";
    return '<tr><td>'+c.名稱+'</td>'+
      '<td>'+c.送出.大+'/'+c.送出.小+'</td>'+
      '<td>'+c.歸還.大+'/'+c.歸還.小+'</td>'+
      '<td class="'+cls+'">$'+c.金額+'</td>'+
      '<td>'+c.類別+'</td>'+
      '<td>'+c.期末.大+'/'+c.期末.小+'</td></tr>';
  }).join("");
}
async function genReport(){
  var m=curMonth(), btn=$("#genExcel"), msg=$("#setMsg");
  if(!m){msg.className="msg err";msg.textContent="請先選月份";return;}
  msg.className="msg"; btn.disabled=true; btn.textContent="產生中…（約 10 秒）";
  try{
    var r=await post({action:"genReport", uid:ME.uid, month:m});
    if(r.ok){
      msg.className="msg ok";
      msg.innerHTML="✅ 已存到雲端硬碟："+
        '<a href="'+r.url+'" target="_blank" rel="noopener" style="color:#256e3d;font-weight:700">開啟 '+r.檔名+'</a>';
      loadReports();
    }else{ msg.className="msg err"; msg.textContent="⚠ "+r.error; }
  }catch(err){ msg.className="msg err"; msg.textContent="產生失敗："+err; }
  btn.disabled=false; btn.textContent="📄 產生 Excel 存到雲端硬碟";
}
async function loadReports(){
  var box=$("#reportList"); box.textContent="載入中…";
  var r=await api({action:"reports"});
  if(!r.ok||!r.files.length){ box.textContent="（尚無報表）"; return; }
  box.innerHTML=r.files.map(function(f){
    return '<div style="padding:9px 0;border-bottom:1px solid #e3e7e5">'+
      '<a href="'+f.url+'" target="_blank" rel="noopener" style="color:#256e3d;font-weight:700">📄 '+f.檔名+'</a>'+
      '<div style="color:#6b766f;font-size:12px">'+f.時間+'</div></div>';
  }).join("");
}

/* ---- 經銷客戶自助 ---- */
async function loadMine(){
  var h=$("#mineHist"); h.textContent="載入中…";
  var r=await api({action:"mine", uid:ME.uid});
  if(!r.ok){ $("#mineName").textContent=r.error; h.textContent="—"; return; }
  $("#mineName").innerHTML='<b style="font-size:18px;color:#1d2521">'+r.客戶+'</b>　目前手上未歸還';
  $("#mineBig").textContent=r.結餘.大;
  $("#mineSmall").textContent=r.結餘.小;
  $("#mineAmt").innerHTML=r.未還金額>0
    ? '未歸還估計金額 <b style="color:#c0392b">$'+r.未還金額+'</b>（月底未還將計價）'
    : '✅ 目前無未歸還';
  if(!r.歷史.length){ h.textContent="（尚無進出紀錄）"; return; }
  h.innerHTML=r.歷史.map(function(x){
    var color=x.動作==="送出"?"#c0392b":"#256e3d";
    var att=x.附件URL
      ? ' <a href="'+x.附件URL+'" target="_blank" rel="noopener" style="color:#256e3d">簽收</a>' : '';
    return '<div style="padding:9px 0;border-bottom:1px solid #e3e7e5;display:flex;gap:8px;align-items:baseline">'+
      '<span style="color:'+color+';font-weight:700;min-width:42px">'+x.動作+'</span>'+
      '<span style="font-weight:700">'+x.棧板別+'棧板 ×'+x.數量+'</span>'+
      '<span style="color:#6b766f;font-size:12px;margin-left:auto;text-align:right">'+
        x.時間+'<br>'+(x.場||'')+att+'</span></div>';
  }).join("");
}
</script>
</body>
</html>
